model:
  name: "facebook/bart-large-mnli"
  max_length: 512
  batch_size: 16
  learning_rate: 2e-5
  num_epochs: 3
  warmup_steps: 100
  weight_decay: 0.01
  device: "auto"

data:
  dataset_type: "news"
  num_samples: 1000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  data_dir: "data"
  output_dir: "data/processed"

training:
  output_dir: "models"
  logging_dir: "logs"
  save_steps: 100
  eval_steps: 50
  logging_steps: 10
  early_stopping_patience: 3
  gradient_accumulation_steps: 1

app:
  title: "Few-Shot Text Classification"
  description: "Interactive demo for few-shot learning"
  host: "localhost"
  port: 8501
  debug: false
